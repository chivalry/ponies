name: Feature Request
description: Suggest something new or an improvement
title: "[Feature]: "
labels: ["enhancement"]
assignees: ["chivalry"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or need?
      description: What are you trying to do, or what's frustrating you?
      placeholder: "I wish I could... / It would help if..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe your idea, as simply or in as much detail as you like.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Examples, mockups, or any other context that might help.
