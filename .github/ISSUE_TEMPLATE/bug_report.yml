name: Bug Report
description: Something isn't working the way you expected
title: "[Bug]: "
labels: ["bug"]
assignees: ["chivalry"]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe what went wrong.
      placeholder: "I tried to do X and instead Y happened..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Step-by-step instructions, if you can.
      placeholder: "1. Go to...\n2. Click...\n3. See the problem"
  - type: textarea
    id: context
    attributes:
      label: Anything else we should know?
      description: Screenshots, error messages, device, browser — anything helpful.
